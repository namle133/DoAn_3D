<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tài khoản - Vinhomes</title>
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body>
  <div id="navbar-placeholder"></div>
  <div class="container">
    <div class="page-header">
      <div>
        <h1 class="page-title">Thông tin tài khoản</h1>
        <p class="page-subtitle">UC 2.7.5 / 2.7.6 — Xem và chỉnh sửa thông tin cá nhân</p>
      </div>
    </div>

    <div class="alert alert-success" id="successMsg" style="display:none"></div>
    <div class="alert alert-error" id="errorMsg" style="display:none"></div>

    <div class="section" id="profileView">
      <div class="loading"><div class="spinner"></div><p>Đang tải...</p></div>
    </div>

    <div class="section">
      <div class="section-title">Đổi mật khẩu</div>
      <form id="passwordForm">
        <div class="form-row">
          <div class="form-group">
            <label>Mật khẩu hiện tại</label>
            <input type="password" id="currentPassword" required />
          </div>
          <div class="form-group">
            <label>Mật khẩu mới</label>
            <input type="password" id="newPassword" required />
          </div>
        </div>
        <div class="form-group">
          <label>Xác nhận mật khẩu mới</label>
          <input type="password" id="confirmNewPassword" required />
        </div>
        <button type="submit" class="btn btn-primary">Cập nhật mật khẩu</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { initLayout, ROLE_LABELS } from '../js/modules/layout.js';
    import authAPI from '../js/api/auth.js';
    import authManager from '../js/modules/auth-manager.js';
    import { formatDate } from '../js/utils/helpers.js';

    await initLayout();

    const profileView = document.getElementById('profileView');
    const user = authManager.getCurrentUser();
    const role = authManager.getUserRole();

    profileView.innerHTML = `
      <div class="form-row">
        <div class="form-group">
          <label>Tên đăng nhập</label>
          <input type="text" value="${user?.username || '-'}" disabled />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="profileEmail" value="${user?.email || '-'}" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Vai trò</label>
          <input type="text" value="${ROLE_LABELS[role] || role}" disabled />
        </div>
        <div class="form-group">
          <label>Trạng thái</label>
          <input type="text" value="${user?.status === 'active' ? 'Đang hoạt động' : (user?.status || 'active')}" disabled />
        </div>
      </div>
      <button class="btn btn-primary" id="saveProfileBtn">Lưu thay đổi</button>
    `;

    document.getElementById('saveProfileBtn').addEventListener('click', () => {
      document.getElementById('successMsg').textContent = 'Đã lưu thông tin (cần API PUT /profile trên backend)';
      document.getElementById('successMsg').style.display = 'block';
    });

    document.getElementById('passwordForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const np = document.getElementById('newPassword').value;
      const cp = document.getElementById('confirmNewPassword').value;
      if (np !== cp) {
        document.getElementById('errorMsg').textContent = 'Mật khẩu xác nhận không khớp';
        document.getElementById('errorMsg').style.display = 'block';
        return;
      }
      document.getElementById('successMsg').textContent = 'Đã cập nhật mật khẩu (cần API trên backend)';
      document.getElementById('successMsg').style.display = 'block';
    });
  </script>
</body>
</html>
