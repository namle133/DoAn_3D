<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quên mật khẩu - Vinhomes</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .box {
      background: #fff; border-radius: 12px; padding: 40px; width: 100%; max-width: 440px;
      box-shadow: 0 20px 60px rgba(0,0,0,.15);
    }
    h1 { text-align: center; margin-bottom: 8px; }
    .sub { text-align: center; color: #666; font-size: 14px; margin-bottom: 24px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 500; }
    input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
    .btn { width: 100%; padding: 12px; background: #667eea; color: #fff; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; margin-top: 8px; }
    .btn:hover { background: #764ba2; }
    .alert { padding: 10px; border-radius: 6px; margin-bottom: 12px; font-size: 13px; display: none; }
    .alert.show { display: block; }
    .alert-success { background: #e8f5e9; color: #2e7d32; }
    .alert-error { background: #ffebee; color: #c62828; }
    .alert-info { background: #e3f2fd; color: #1565c0; }
    .links { text-align: center; margin-top: 16px; font-size: 14px; }
    .links a { color: #667eea; }
    .step { display: none; }
    .step.active { display: block; }
    .token-box { background: #f5f5f5; padding: 10px; border-radius: 6px; font-family: monospace; word-break: break-all; margin: 10px 0; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Quên mật khẩu</h1>
    <p class="sub">UC 2.7.4 — Khôi phục tài khoản Vinhomes</p>

    <div id="alertBox" class="alert"></div>

    <!-- Bước 1: Nhập email -->
    <div id="step1" class="step active">
      <form id="forgotForm">
        <div class="form-group">
          <label for="email">Email đăng ký</label>
          <input type="email" id="email" required placeholder="email@example.com" />
        </div>
        <button type="submit" class="btn" id="sendBtn">Gửi mã đặt lại mật khẩu</button>
      </form>
    </div>

    <!-- Bước 2: Nhập mã + mật khẩu mới -->
    <div id="step2" class="step">
      <p style="font-size:13px;color:#666;margin-bottom:12px">Nhập mã reset và mật khẩu mới:</p>
      <div id="tokenDisplay" class="token-box" style="display:none"></div>
      <form id="resetForm">
        <input type="hidden" id="resetEmail" />
        <div class="form-group">
          <label for="token">Mã reset</label>
          <input type="text" id="token" required placeholder="Mã 32 ký tự" />
        </div>
        <div class="form-group">
          <label for="newPassword">Mật khẩu mới</label>
          <input type="password" id="newPassword" required minlength="6" placeholder="Tối thiểu 6 ký tự" />
        </div>
        <div class="form-group">
          <label for="confirmPassword">Xác nhận mật khẩu</label>
          <input type="password" id="confirmPassword" required minlength="6" />
        </div>
        <button type="submit" class="btn">Đặt lại mật khẩu</button>
      </form>
    </div>

    <div class="links">
      <a href="/pages/login.html">← Quay lại đăng nhập</a>
    </div>
  </div>

  <script type="module">
    import authAPI from '../js/api/auth.js';
    import { showToast } from '../js/utils/helpers.js';

    const alertBox = document.getElementById('alertBox');
    function showAlert(msg, type) {
      alertBox.textContent = msg;
      alertBox.className = 'alert show alert-' + type;
    }

    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      document.getElementById('sendBtn').disabled = true;
      try {
        const res = await authAPI.forgotPassword(email);
        showAlert(res.message || 'Đã gửi mã reset', 'success');
        document.getElementById('resetEmail').value = email;
        document.getElementById('step1').classList.remove('active');
        document.getElementById('step2').classList.add('active');
        if (res.data?.reset_token) {
          document.getElementById('token').value = res.data.reset_token;
          document.getElementById('tokenDisplay').style.display = 'block';
          document.getElementById('tokenDisplay').textContent = 'Mã demo: ' + res.data.reset_token;
        }
      } catch (err) {
        showAlert(err.message, 'error');
      } finally {
        document.getElementById('sendBtn').disabled = false;
      }
    });

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('resetEmail').value;
      const token = document.getElementById('token').value;
      const pw = document.getElementById('newPassword').value;
      const confirm = document.getElementById('confirmPassword').value;
      if (pw !== confirm) {
        showAlert('Mật khẩu xác nhận không khớp', 'error');
        return;
      }
      try {
        await authAPI.resetPassword(email, token, pw);
        showAlert('Đặt lại mật khẩu thành công! Chuyển đến trang đăng nhập...', 'success');
        showToast('Đặt lại mật khẩu thành công', 'success');
        setTimeout(() => { window.location.href = '/pages/login.html'; }, 2000);
      } catch (err) {
        showAlert(err.message, 'error');
      }
    });
  </script>
</body>
</html>
