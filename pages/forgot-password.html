<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quên mật khẩu - Vinhomes</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .box {
      background: rgba(255,255,255,.95); backdrop-filter: blur(10px);
      border-radius: 20px; padding: 44px 36px; width: 100%; max-width: 460px;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
      animation: slideUp .4s ease-out;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .logo-icon { text-align: center; font-size: 42px; color: #667eea; margin-bottom: 8px; }
    h1 { text-align: center; font-size: 26px; color: #333; margin-bottom: 6px; }
    .sub { text-align: center; color: #888; font-size: 13px; margin-bottom: 24px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 500; color: #444; }
    label i { color: #667eea; margin-right: 4px; }
    input {
      width: 100%; padding: 12px 14px; border: 1px solid #e0e0e0; border-radius: 8px;
      font-size: 14px; transition: border-color .2s, box-shadow .2s;
    }
    input:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,.15); }
    .btn {
      width: 100%; padding: 13px; background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600;
      cursor: pointer; margin-top: 8px; transition: opacity .2s, transform .15s;
    }
    .btn:hover:not(:disabled) { opacity: .92; transform: translateY(-1px); }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
    .alert { padding: 12px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 13px; display: none; }
    .alert.show { display: block; animation: slideDown .3s ease; }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
    .alert-success { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }
    .alert-error { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; }
    .alert-info { background: #e3f2fd; color: #1565c0; border: 1px solid #bbdefb; }
    .links { text-align: center; margin-top: 20px; font-size: 14px; }
    .links a { color: #667eea; text-decoration: none; font-weight: 500; }
    .links a:hover { text-decoration: underline; }
    .step { display: none; }
    .step.active { display: block; }
    .token-box {
      background: #f8f9ff; border: 1px dashed #667eea; padding: 12px; border-radius: 8px;
      font-family: monospace; font-size: 13px; word-break: break-all; margin: 12px 0;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .token-box span { flex: 1; }
    .copy-btn {
      background: #667eea; color: #fff; border: none; padding: 6px 10px;
      border-radius: 6px; font-size: 12px; cursor: pointer; white-space: nowrap;
    }
    .copy-btn:hover { background: #5a6fd6; }
    .step-hint { font-size: 13px; color: #666; margin-bottom: 14px; line-height: 1.5; }
    .step-badge {
      display: inline-block; background: #667eea; color: #fff; font-size: 11px;
      padding: 2px 8px; border-radius: 10px; margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo-icon"><i class="fas fa-key"></i></div>
    <h1>Quên mật khẩu</h1>
    <p class="sub">Khôi phục tài khoản Vinhomes Property Management</p>

    <div id="alertBox" class="alert"></div>

    <!-- Bước 1: Nhập email -->
    <div id="step1" class="step active">
      <span class="step-badge">Bước 1 / 2</span>
      <p class="step-hint">Nhập email đã đăng ký. Hệ thống sẽ tạo mã đặt lại mật khẩu (môi trường demo hiển thị mã ngay trên màn hình).</p>
      <form id="forgotForm">
        <div class="form-group">
          <label for="email"><i class="fas fa-envelope"></i> Email đăng ký</label>
          <input type="email" id="email" required placeholder="vd: admin@vinhomes.com" autocomplete="email" />
        </div>
        <button type="submit" class="btn" id="sendBtn"><i class="fas fa-paper-plane"></i> Gửi mã đặt lại</button>
      </form>
    </div>

    <!-- Bước 2: Nhập mã + mật khẩu mới -->
    <div id="step2" class="step">
      <span class="step-badge">Bước 2 / 2</span>
      <p class="step-hint">Nhập mã reset và mật khẩu mới (tối thiểu 6 ký tự).</p>
      <div id="tokenDisplay" class="token-box" style="display:none">
        <span id="tokenText"></span>
        <button type="button" class="copy-btn" id="copyTokenBtn">Sao chép</button>
      </div>
      <form id="resetForm">
        <input type="hidden" id="resetEmail" />
        <div class="form-group">
          <label for="token"><i class="fas fa-shield-alt"></i> Mã reset</label>
          <input type="text" id="token" required placeholder="Mã 32 ký tự" autocomplete="off" />
        </div>
        <div class="form-group">
          <label for="newPassword"><i class="fas fa-lock"></i> Mật khẩu mới</label>
          <input type="password" id="newPassword" required minlength="6" placeholder="Tối thiểu 6 ký tự" />
        </div>
        <div class="form-group">
          <label for="confirmPassword"><i class="fas fa-lock"></i> Xác nhận mật khẩu</label>
          <input type="password" id="confirmPassword" required minlength="6" />
        </div>
        <button type="submit" class="btn"><i class="fas fa-check"></i> Đặt lại mật khẩu</button>
      </form>
    </div>

    <div class="links">
      <a href="/pages/login.html"><i class="fas fa-arrow-left"></i> Quay lại đăng nhập</a>
    </div>
  </div>

  <script type="module">
    import authAPI from '../js/api/auth.js';

    const alertBox = document.getElementById('alertBox');
    function showAlert(msg, type) {
      alertBox.textContent = msg;
      alertBox.className = 'alert show alert-' + type;
    }

    document.getElementById('copyTokenBtn')?.addEventListener('click', async () => {
      const text = document.getElementById('tokenText')?.textContent || '';
      try {
        await navigator.clipboard.writeText(text);
        showAlert('Đã sao chép mã reset', 'info');
      } catch {
        showAlert('Không thể sao chép — hãy chọn và copy thủ công', 'error');
      }
    });

    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const sendBtn = document.getElementById('sendBtn');
      sendBtn.disabled = true;
      try {
        const res = await authAPI.forgotPassword(email);
        showAlert(res.message || 'Đã gửi mã reset. Kiểm tra bước 2 bên dưới.', 'success');
        document.getElementById('resetEmail').value = email;
        document.getElementById('step1').classList.remove('active');
        document.getElementById('step2').classList.add('active');

        const token = res.data?.reset_token;
        if (token) {
          document.getElementById('token').value = token;
          document.getElementById('tokenText').textContent = token;
          document.getElementById('tokenDisplay').style.display = 'flex';
        }
      } catch (err) {
        showAlert(err.message || 'Không thể gửi yêu cầu', 'error');
      } finally {
        sendBtn.disabled = false;
      }
    });

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('resetEmail').value;
      const token = document.getElementById('token').value.trim();
      const pw = document.getElementById('newPassword').value;
      const confirm = document.getElementById('confirmPassword').value;

      if (pw !== confirm) {
        showAlert('Mật khẩu xác nhận không khớp', 'error');
        return;
      }
      if (pw.length < 6) {
        showAlert('Mật khẩu phải có ít nhất 6 ký tự', 'error');
        return;
      }

      const submitBtn = e.target.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      try {
        await authAPI.resetPassword(email, token, pw);
        showAlert('Đặt lại mật khẩu thành công! Đang chuyển đến trang đăng nhập...', 'success');
        setTimeout(() => {
          window.location.href = '/pages/login.html?reset=success';
        }, 1800);
      } catch (err) {
        showAlert(err.message || 'Đặt lại mật khẩu thất bại', 'error');
      } finally {
        submitBtn.disabled = false;
      }
    });

    // Prefill email from query ?email=
    const params = new URLSearchParams(window.location.search);
    const prefill = params.get('email');
    if (prefill) document.getElementById('email').value = prefill;
  </script>
</body>
</html>
