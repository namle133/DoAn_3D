<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quản lý Tòa nhà - Vinhomes</title>
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body>
  <div id="navbar-placeholder"></div>
  <div class="container">
    <div class="page-header">
      <div>
        <h1 class="page-title">Quản lý Tòa nhà — Tầng — Căn hộ</h1>
        <p class="page-subtitle">Module M3 — UC 2.7.13 → 2.7.19</p>
      </div>
      <button class="btn btn-primary" id="addBuildingBtn">+ Thêm tòa nhà</button>
    </div>

    <!-- Chú thích màu trạng thái (GIS) -->
    <div class="section" style="padding:14px 20px">
      <div style="display:flex;gap:16px;flex-wrap:wrap;font-size:13px">
        <span><span class="badge badge-gray">■</span> Trống</span>
        <span><span class="badge badge-blue">■</span> Đang thuê</span>
        <span><span class="badge badge-orange">■</span> Sắp hết HĐ</span>
        <span><span class="badge badge-red">■</span> Đang bảo trì</span>
        <a href="/index.html" target="_blank" class="btn btn-sm btn-outline" style="margin-left:auto">Mở GIS 3D →</a>
      </div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="buildings">Tòa nhà</button>
      <button class="tab-btn" data-tab="apartments">Căn hộ</button>
    </div>

    <div class="tab-panel active" id="tab-buildings">
      <div class="search-bar"><input type="text" id="searchBuilding" placeholder="Tìm tòa nhà..." /></div>
      <div class="section" id="buildingsList"><div class="loading"><div class="spinner"></div></div></div>
    </div>

    <div class="tab-panel" id="tab-apartments">
      <div class="filter-bar">
        <select id="filterStatus">
          <option value="">Tất cả trạng thái</option>
          <option value="empty">Trống</option>
          <option value="rented">Đang thuê</option>
          <option value="maintenance">Bảo trì</option>
        </select>
        <input type="text" id="searchApartment" placeholder="Tìm mã căn hộ..." style="padding:8px 12px;border:1px solid #ddd;border-radius:6px" />
      </div>
      <div class="section" id="apartmentsList"><div class="loading"><div class="spinner"></div></div></div>
    </div>
  </div>

  <!-- Modal thêm tòa nhà -->
  <div class="modal" id="buildingModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="buildingModalTitle">Thêm tòa nhà</h2>
        <button class="close-btn" id="closeBuildingModal">&times;</button>
      </div>
      <form id="buildingForm">
        <div class="form-group"><label>Tên tòa nhà *</label><input type="text" id="bName" required /></div>
        <div class="form-group"><label>Địa chỉ</label><input type="text" id="bAddress" /></div>
        <div class="form-row">
          <div class="form-group"><label>Năm xây dựng</label><input type="number" id="bYear" /></div>
          <div class="form-group"><label>Tổng số tầng</label><input type="number" id="bFloors" /></div>
        </div>
        <div class="form-group"><label>Mô tả</label><textarea id="bDesc" rows="2"></textarea></div>
        <div class="form-buttons">
          <button type="button" class="btn-cancel" id="cancelBuilding">Hủy</button>
          <button type="submit" class="btn btn-primary">Lưu</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal cập nhật trạng thái căn hộ -->
  <div class="modal" id="statusModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Cập nhật trạng thái căn hộ</h2>
        <button class="close-btn" id="closeStatusModal">&times;</button>
      </div>
      <form id="statusForm">
        <input type="hidden" id="statusAptId" />
        <div class="form-group">
          <label>Trạng thái mới</label>
          <select id="newStatus" required>
            <option value="empty">Trống</option>
            <option value="rented">Đang thuê</option>
            <option value="maintenance">Đang bảo trì</option>
          </select>
        </div>
        <div class="form-group"><label>Lý do thay đổi</label><textarea id="statusReason" rows="2" required></textarea></div>
        <div class="form-buttons">
          <button type="button" class="btn-cancel" id="cancelStatus">Hủy</button>
          <button type="submit" class="btn btn-primary">Cập nhật</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { initLayout } from '../js/modules/layout.js';
    import buildingsAPI from '../js/api/buildings.js';
    import { showToast } from '../js/utils/helpers.js';

    await initLayout({ requiredRoles: ['admin', 'manager', 'staff'] });

    let buildings = [], apartments = [];

    // Tabs
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
      });
    });

    const STATUS_BADGE = {
      empty: 'badge-gray', rented: 'badge-blue',
      maintenance: 'badge-red', reserved: 'badge-orange',
    };
    const STATUS_LABEL = {
      empty: 'Trống', rented: 'Đang thuê',
      maintenance: 'Bảo trì', reserved: 'Đặt trước',
    };

    async function loadBuildings() {
      try {
        const res = await buildingsAPI.getBuildings();
        // Handle both array and object responses
        buildings = Array.isArray(res) ? res : (res.data || res.buildings || []);
        renderBuildings(buildings);
      } catch (err) {
        document.getElementById('buildingsList').innerHTML =
          `<div class="empty-state"><p>${err.message}</p></div>`;
      }
    }

    async function loadApartments() {
      try {
        const res = await buildingsAPI.getApartments();
        // Handle both array and object responses
        apartments = Array.isArray(res) ? res : (res.data || res.apartments || []);
        renderApartments(apartments);
      } catch (err) {
        document.getElementById('apartmentsList').innerHTML =
          `<div class="empty-state"><p>${err.message}</p></div>`;
      }
    }

    function renderBuildings(list) {
      const el = document.getElementById('buildingsList');
      if (!list.length) {
        el.innerHTML = `<div class="empty-state"><div class="empty-state-icon">🏢</div><p>Chưa có tòa nhà. Nhấn "+ Thêm tòa nhà" để bắt đầu.</p></div>`;
        return;
      }
      el.innerHTML = `<div class="table-responsive"><table>
        <thead><tr><th>Tên</th><th>Địa chỉ</th><th>Năm XD</th><th>Số tầng</th><th>Thao tác</th></tr></thead>
        <tbody>${list.map(b => `<tr>
          <td><strong>${b.name}</strong></td>
          <td>${b.address || '-'}</td>
          <td>${b.year_built || '-'}</td>
          <td>${b.total_floors || '-'}</td>
          <td>
            <button class="btn btn-sm btn-outline view-floors" data-id="${b.id}">Tầng</button>
            <a href="/index.html" target="_blank" class="btn btn-sm btn-outline">GIS 3D</a>
          </td>
        </tr>`).join('')}</tbody></table></div>`;
    }

    function renderApartments(list) {
      const el = document.getElementById('apartmentsList');
      if (!list.length) {
        el.innerHTML = `<div class="empty-state"><div class="empty-state-icon">🏠</div><p>Chưa có căn hộ</p></div>`;
        return;
      }
      el.innerHTML = `<div class="table-responsive"><table>
        <thead><tr><th>Mã căn</th><th>Diện tích</th><th>PN</th><th>Hướng</th><th>Giá thuê</th><th>Trạng thái</th><th>Thao tác</th></tr></thead>
        <tbody>${list.map(a => `<tr>
          <td><strong>${a.apartment_code || a.id}</strong></td>
          <td>${a.area ? a.area + ' m²' : '-'}</td>
          <td>${a.bedrooms || '-'}</td>
          <td>${a.direction || '-'}</td>
          <td>${a.listing_price ? a.listing_price.toLocaleString('vi-VN') + ' đ' : '-'}</td>
          <td><span class="badge ${STATUS_BADGE[a.current_status] || 'badge-gray'}">${STATUS_LABEL[a.current_status] || a.current_status}</span></td>
          <td><button class="btn btn-sm btn-outline update-status" data-id="${a.id}">Đổi TT</button></td>
        </tr>`).join('')}</tbody></table></div>`;

      el.querySelectorAll('.update-status').forEach(btn => {
        btn.addEventListener('click', () => {
          document.getElementById('statusAptId').value = btn.dataset.id;
          document.getElementById('statusModal').classList.add('show');
        });
      });
    }

    // Modal building
    const buildingModal = document.getElementById('buildingModal');
    document.getElementById('addBuildingBtn').addEventListener('click', () => buildingModal.classList.add('show'));
    document.getElementById('closeBuildingModal').addEventListener('click', () => buildingModal.classList.remove('show'));
    document.getElementById('cancelBuilding').addEventListener('click', () => buildingModal.classList.remove('show'));

    document.getElementById('buildingForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await buildingsAPI.createBuilding({
          name: document.getElementById('bName').value,
          address: document.getElementById('bAddress').value,
          year_built: parseInt(document.getElementById('bYear').value) || 0,
          total_floors: parseInt(document.getElementById('bFloors').value) || 0,
          description: document.getElementById('bDesc').value,
        });
        buildingModal.classList.remove('show');
        showToast('Đã thêm tòa nhà', 'success');
        loadBuildings();
      } catch (err) { showToast(err.message, 'error'); }
    });

    // Modal status
    const statusModal = document.getElementById('statusModal');
    document.getElementById('closeStatusModal').addEventListener('click', () => statusModal.classList.remove('show'));
    document.getElementById('cancelStatus').addEventListener('click', () => statusModal.classList.remove('show'));

    document.getElementById('statusForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('statusAptId').value;
      try {
        await buildingsAPI.updateApartmentStatus(id, {
          status: document.getElementById('newStatus').value,
          reason: document.getElementById('statusReason').value,
        });
        statusModal.classList.remove('show');
        showToast('Đã cập nhật trạng thái — GIS 3D sẽ đổi màu', 'success');
        loadApartments();
      } catch (err) { showToast(err.message, 'error'); }
    });

    // Search/filter
    document.getElementById('searchBuilding').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      renderBuildings(buildings.filter(b => b.name?.toLowerCase().includes(q)));
    });
    document.getElementById('filterStatus').addEventListener('change', filterApartments);
    document.getElementById('searchApartment').addEventListener('input', filterApartments);
    function filterApartments() {
      const status = document.getElementById('filterStatus').value;
      const q = document.getElementById('searchApartment').value.toLowerCase();
      renderApartments(apartments.filter(a =>
        (!status || a.current_status === status) &&
        (!q || (a.apartment_code || a.id || '').toLowerCase().includes(q))
      ));
    }

    loadBuildings();
    loadApartments();
  </script>
</body>
</html>
