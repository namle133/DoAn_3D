<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập - Vinhomes Property Management</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      width: 400px;
      height: 400px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      top: -100px;
      right: -100px;
      animation: float 6s ease-in-out infinite;
      z-index: 0;
    }

    body::after {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      bottom: -50px;
      left: -50px;
      animation: float 8s ease-in-out infinite;
      z-index: 0;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(20px); }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.6);
      width: 100%;
      max-width: 450px;
      padding: 50px 40px;
      animation: slideUp 0.5s ease-out;
      position: relative;
      z-index: 1;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .logo {
      text-align: center;
      margin-bottom: 35px;
    }

    .logo-icon {
      font-size: 48px;
      color: #667eea;
      margin-bottom: 12px;
      animation: bounce 2s ease-in-out infinite;
    }

    .logo h1 {
      color: #333;
      font-size: 32px;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .logo p {
      color: #999;
      font-size: 13px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .form-group {
      margin-bottom: 22px;
      position: relative;
    }

    label {
      display: block;
      margin-bottom: 10px;
      color: #555;
      font-weight: 600;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    label i {
      color: #667eea;
      width: 16px;
    }

    input[type='email'],
    input[type='password'] {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e8e8e8;
      border-radius: 12px;
      font-size: 14px;
      transition: all 0.3s ease;
      background: rgba(255, 255, 255, 0.8);
    }

    input[type='email']:focus,
    input[type='password']:focus {
      outline: none;
      border-color: #667eea;
      background: white;
      box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
    }

    input[type='email']::placeholder,
    input[type='password']::placeholder {
      color: #bbb;
    }

    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      font-size: 13px;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #666;
      cursor: pointer;
    }

    .remember-me input {
      cursor: pointer;
      width: 16px;
      height: 16px;
    }

    .forgot-password {
      color: #667eea;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s;
    }

    .forgot-password:hover {
      color: #764ba2;
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(102, 126, 234, 0.4);
    }

    .btn-login:active {
      transform: translateY(0);
    }

    .btn-login i {
      font-size: 16px;
    }

    .divider {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
      color: #ddd;
    }

    .divider span {
      flex: 1;
      height: 1px;
      background: #ddd;
    }

    .divider p {
      margin: 0 12px;
      color: #999;
      font-size: 12px;
    }

    .social-login {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }

    .social-btn {
      flex: 1;
      padding: 12px;
      border: 2px solid #e8e8e8;
      background: white;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .social-btn:hover {
      border-color: #667eea;
      background: rgba(102, 126, 234, 0.05);
      transform: translateY(-2px);
    }

    .signup-link {
      text-align: center;
      color: #666;
      font-size: 14px;
    }

    .signup-link a {
      color: #667eea;
      font-weight: 600;
      text-decoration: none;
      transition: color 0.3s;
    }

    .signup-link a:hover {
      color: #764ba2;
      text-decoration: underline;
    }

    .alert {
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: none;
      animation: slideDown 0.3s ease-out;
      font-size: 14px;
      display: none;
      align-items: center;
      gap: 10px;
    }

    .alert-error {
      background: #fee;
      color: #c33;
      border-left: 4px solid #c33;
      display: none;
    }

    .alert-error.show {
      display: flex;
    }

    .alert-error i {
      color: #c33;
    }

    .alert-success {
      background: #efe;
      color: #3c3;
      border-left: 4px solid #3c3;
      display: none;
    }

    .alert-success.show {
      display: flex;
    }

    .alert-success i {
      color: #3c3;
    }

    @media (max-width: 480px) {
      .login-container {
        padding: 40px 25px;
        max-width: 100%;
      }

      .logo h1 {
        font-size: 26px;
      }

      .btn-login {
        font-size: 14px;
        padding: 12px;
      }

      body::before {
        width: 250px;
        height: 250px;
      }

      body::after {
        width: 200px;
        height: 200px;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">
      <div class="logo-icon"><i class="fas fa-building"></i></div>
      <h1>Vinhomes</h1>
      <p>Property Management</p>
    </div>

    <div class="alert alert-error" id="errorMsg">
      <i class="fas fa-exclamation-circle"></i>
      <span id="errorText"></span>
    </div>
    <div class="alert alert-success" id="successMsg">
      <i class="fas fa-check-circle"></i>
      <span id="successText"></span>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email"><i class="fas fa-envelope"></i> Email</label>
        <input type="email" id="email" placeholder="example@vinhomes.com" required />
      </div>

      <div class="form-group">
        <label for="password"><i class="fas fa-lock"></i> Mật khẩu</label>
        <input type="password" id="password" placeholder="••••••••" required />
      </div>

      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox" id="rememberMe" />
          <span>Ghi nhớ mật khẩu</span>
        </label>
        <a href="/pages/forgot-password.html" class="forgot-password">Quên mật khẩu?</a>
      </div>

      <button type="submit" class="btn-login">
        <i class="fas fa-sign-in-alt"></i> Đăng nhập
      </button>
    </form>

    <div class="divider">
      <span></span>
      <p>HOẶC</p>
      <span></span>
    </div>

    <div class="social-login">
      <button class="social-btn" title="Đăng nhập với Google" type="button">
        <i class="fab fa-google" style="color: #EA4335;"></i>
      </button>
      <button class="social-btn" title="Đăng nhập với Facebook" type="button">
        <i class="fab fa-facebook" style="color: #1877F2;"></i>
      </button>
    </div>

    <p class="signup-link">
      Chưa có tài khoản? <a href="/pages/register.html">Đăng ký ngay</a>
    </p>
  </div>

  <script type="module">
    import authManager from '../js/modules/auth-manager.js';
    import { validateEmail, validatePassword } from '../js/utils/validators.js';

    if (authManager.isAuthenticated()) authManager.redirectToDashboard();

    const form = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const errorText = document.getElementById('errorText');
    const successMsg = document.getElementById('successMsg');
    const successText = document.getElementById('successText');

    function showError(message) {
      errorText.textContent = message;
      errorMsg.classList.add('show');
      setTimeout(() => errorMsg.classList.remove('show'), 5000);
    }

    function showSuccess(message) {
      successText.textContent = message;
      successMsg.classList.add('show');
    }

    function hideMessages() {
      errorMsg.classList.remove('show');
      successMsg.classList.remove('show');
    }

    const resetParams = new URLSearchParams(window.location.search);
    if (resetParams.get('reset') === 'success') {
      showSuccess('Đặt lại mật khẩu thành công. Vui lòng đăng nhập bằng mật khẩu mới.');
      window.history.replaceState({}, '', '/pages/login.html');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      hideMessages();

      if (!validateEmail(email)) {
        showError('Email không hợp lệ');
        return;
      }

      if (!password || password.length < 6) {
        showError('Mật khẩu phải ít nhất 6 ký tự');
        return;
      }

      try {
        const result = await authManager.login(email, password);
        // Check if login was successful (API returns token on success)
        if (result && (result.token || result.data?.token)) {
          showSuccess('Đăng nhập thành công! Chuyển hướng...');
          setTimeout(() => authManager.redirectToDashboard(), 1500);
        } else {
          showError(result?.error || result?.message || 'Đăng nhập thất bại');
        }
      } catch (error) {
        showError(error.message || 'Lỗi kết nối server');
      }
    });

    document.querySelector('.forgot-password')?.addEventListener('click', (e) => {
      const email = document.getElementById('email').value.trim();
      if (email) {
        e.preventDefault();
        window.location.href = `/pages/forgot-password.html?email=${encodeURIComponent(email)}`;
      }
    });

    document.querySelectorAll('.social-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        showError('Tính năng này sắp có mặt');
      });
    });
  </script>
</body>
</html>
