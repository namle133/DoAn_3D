<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thông báo - Vinhomes</title>
  <link rel="stylesheet" href="../css/admin.css" />
  <style>
    .notif-item {
      padding: 14px 16px;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      transition: background 0.2s;
    }
    .notif-item:hover { background: #fafbff; }
    .notif-item.unread { background: #f8f9ff; border-left: 3px solid #667eea; }
    .notif-type {
      display: inline-block;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      background: #eef0ff;
      color: #667eea;
      margin-bottom: 4px;
    }
    .notif-meta { font-size: 11px; color: #999; margin-top: 6px; }
    .kpi-inline {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .kpi-inline .pill {
      background: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    #recipientGroup { display: none; }
  </style>
</head>
<body>
  <div id="navbar-placeholder"></div>
  <div class="container">
    <div class="page-header">
      <div>
        <h1 class="page-title">Thông báo</h1>
        <p class="page-subtitle">UC 2.7.45 — Quản lý thông báo hệ thống</p>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-outline" id="markAllReadBtn">Đánh dấu tất cả đã đọc</button>
        <button class="btn btn-primary" id="composeBtn" style="display:none">+ Soạn thông báo</button>
      </div>
    </div>

    <div class="kpi-inline" id="notifKpi" style="display:none"></div>

    <div class="tabs" id="tabBar">
      <button class="tab-btn active" data-tab="all">Tất cả</button>
      <button class="tab-btn" data-tab="unread">Chưa đọc</button>
      <button class="tab-btn" data-tab="system" id="systemTab" style="display:none">Hệ thống (Admin)</button>
    </div>

    <div class="section" id="notifList">
      <div class="loading"><div class="spinner"></div><p>Đang tải...</p></div>
    </div>
  </div>

  <div class="modal" id="composeModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Soạn thông báo</h2>
        <button class="close-btn" id="closeCompose">&times;</button>
      </div>
      <form id="composeForm">
        <div class="form-group">
          <label>Gửi tới</label>
          <select id="notifTarget" required>
            <option value="residents">Tất cả cư dân</option>
            <option value="staff">Tất cả nhân viên</option>
            <option value="managers">Ban quản lý & Admin</option>
            <option value="all_users">Toàn bộ người dùng</option>
            <option value="single">Một người cụ thể</option>
          </select>
        </div>
        <div class="form-group" id="recipientGroup">
          <label>Người nhận</label>
          <select id="notifUserId">
            <option value="">-- Chọn tài khoản --</option>
          </select>
        </div>
        <div class="form-group">
          <label>Tiêu đề</label>
          <input type="text" id="notifTitle" required placeholder="Tiêu đề thông báo..." />
        </div>
        <div class="form-group">
          <label>Nội dung</label>
          <textarea id="notifMessage" rows="4" required placeholder="Nội dung chi tiết..."></textarea>
        </div>
        <div class="form-group">
          <label>Loại</label>
          <select id="notifType">
            <option value="general">Thông báo chung</option>
            <option value="contract_expiring">Hợp đồng sắp hết hạn</option>
            <option value="invoice_overdue">Hóa đơn quá hạn</option>
            <option value="maintenance_update">Cập nhật bảo trì</option>
            <option value="payment_received">Đã nhận thanh toán</option>
          </select>
        </div>
        <div class="form-buttons">
          <button type="button" class="btn-cancel" id="cancelCompose">Hủy</button>
          <button type="submit" class="btn btn-primary">Gửi thông báo</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { initLayout } from '../js/modules/layout.js';
    import authManager from '../js/modules/auth-manager.js';
    import notificationAPI from '../js/api/notifications.js';
    import usersAPI from '../js/api/users.js';
    import { formatDate, showToast } from '../js/utils/helpers.js';

    await initLayout();
    const role = authManager.getUserRole();
    const canCompose = ['admin', 'manager'].includes(role);
    const canViewSystem = role === 'admin' || role === 'manager';

    if (canCompose) {
      document.getElementById('composeBtn').style.display = 'inline-flex';
    }
    if (canViewSystem) {
      document.getElementById('systemTab').style.display = 'inline-block';
    }

    let allNotifications = [];
    let unreadCount = 0;
    let currentTab = 'all';

    const TYPE_LABELS = {
      general: 'Thông báo chung',
      contract_expiring: 'HĐ sắp hết hạn',
      contract_approved: 'HĐ đã duyệt',
      contract_rejected: 'HĐ bị từ chối',
      invoice_overdue: 'Hóa đơn quá hạn',
      invoice_generated: 'Hóa đơn mới',
      maintenance_update: 'Bảo trì',
      maintenance_request: 'Yêu cầu bảo trì',
      maintenance_assigned: 'Phân công bảo trì',
      payment_received: 'Đã thanh toán',
      equipment_maintenance: 'Bảo trì thiết bị',
    };

    function parseList(res) {
      if (Array.isArray(res)) return { list: res, unread: res.filter((n) => !n.is_read).length };
      return { list: res.data || [], unread: res.unread_count ?? (res.data || []).filter((n) => !n.is_read).length };
    }

    function typeLabel(type) {
      return TYPE_LABELS[type] || type || 'general';
    }

    async function loadNotifications() {
      const el = document.getElementById('notifList');
      try {
        const scope = currentTab === 'system' ? 'all' : undefined;
        const res = await notificationAPI.getUserNotifications(scope);
        const parsed = parseList(res);
        allNotifications = parsed.list;
        unreadCount = parsed.unread;

        document.getElementById('notifKpi').style.display = 'flex';
        document.getElementById('notifKpi').innerHTML = `
          <span class="pill">Tổng: <strong>${allNotifications.length}</strong></span>
          <span class="pill" style="color:#c62828">Chưa đọc: <strong>${unreadCount}</strong></span>
        `;

        renderList();
        window.dispatchEvent(new CustomEvent('notificationsUpdated'));
      } catch (err) {
        el.innerHTML = `<div class="empty-state"><div class="empty-state-icon">⚠️</div><p>${err.message}</p></div>`;
      }
    }

    function renderList() {
      let list = allNotifications;
      if (currentTab === 'unread') {
        list = list.filter((n) => !n.is_read);
      }

      const el = document.getElementById('notifList');
      if (!list.length) {
        el.innerHTML = `<div class="empty-state"><div class="empty-state-icon">🔔</div><p>Không có thông báo</p></div>`;
        return;
      }

      el.innerHTML = list.map((n) => `
        <div class="notif-item ${n.is_read ? '' : 'unread'}">
          <div style="flex:1">
            <span class="notif-type">${typeLabel(n.type)}</span>
            <div style="font-weight:${n.is_read ? '500' : '700'};margin-bottom:4px">${n.title}</div>
            <div style="font-size:13px;color:#555;line-height:1.5">${n.message}</div>
            <div class="notif-meta">
              ${formatDate(n.created_at, 'dd/mm/yyyy hh:mm')}
              ${n.username && currentTab === 'system' ? ` · Gửi tới: ${n.username}` : ''}
            </div>
          </div>
          <div style="display:flex;gap:6px;flex-shrink:0">
            ${!n.is_read && currentTab !== 'system' ? `<button class="btn btn-sm btn-outline mark-read" data-id="${n.id}">Đã đọc</button>` : ''}
            ${currentTab !== 'system' ? `<button class="btn btn-sm btn-danger delete-notif" data-id="${n.id}">Xóa</button>` : ''}
          </div>
        </div>
      `).join('');

      el.querySelectorAll('.mark-read').forEach((btn) => {
        btn.addEventListener('click', async () => {
          try {
            await notificationAPI.markNotificationAsRead(btn.dataset.id);
            showToast('Đã đánh dấu đọc', 'success');
            loadNotifications();
          } catch (e) {
            showToast(e.message, 'error');
          }
        });
      });
      el.querySelectorAll('.delete-notif').forEach((btn) => {
        btn.addEventListener('click', async () => {
          if (!confirm('Xóa thông báo này?')) return;
          try {
            await notificationAPI.deleteNotification(btn.dataset.id);
            showToast('Đã xóa', 'success');
            loadNotifications();
          } catch (e) {
            showToast(e.message, 'error');
          }
        });
      });
    }

    document.querySelectorAll('.tab-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        currentTab = btn.dataset.tab;
        loadNotifications();
      });
    });

    document.getElementById('markAllReadBtn').addEventListener('click', async () => {
      try {
        await notificationAPI.markAllNotificationsAsRead();
        showToast('Đã đánh dấu tất cả đã đọc', 'success');
        loadNotifications();
      } catch (e) {
        showToast(e.message, 'error');
      }
    });

    const modal = document.getElementById('composeModal');
    document.getElementById('composeBtn').addEventListener('click', () => modal.classList.add('show'));
    document.getElementById('closeCompose').addEventListener('click', () => modal.classList.remove('show'));
    document.getElementById('cancelCompose').addEventListener('click', () => modal.classList.remove('show'));
    modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('show'); });

    document.getElementById('notifTarget').addEventListener('change', (e) => {
      document.getElementById('recipientGroup').style.display =
        e.target.value === 'single' ? 'block' : 'none';
    });

    async function loadUsersForCompose() {
      if (!canCompose) return;
      try {
        const res = await usersAPI.getUsers();
        const users = res.data || [];
        const select = document.getElementById('notifUserId');
        select.innerHTML = '<option value="">-- Chọn tài khoản --</option>';
        users.filter((u) => u.status === 'active').forEach((u) => {
          const opt = document.createElement('option');
          opt.value = u.id;
          opt.textContent = `${u.username} (${u.role})`;
          select.appendChild(opt);
        });
      } catch (_) {}
    }

    document.getElementById('composeForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const target = document.getElementById('notifTarget').value;
      const payload = {
        title: document.getElementById('notifTitle').value.trim(),
        message: document.getElementById('notifMessage').value.trim(),
        type: document.getElementById('notifType').value,
        target,
      };
      if (target === 'single') {
        payload.user_id = document.getElementById('notifUserId').value;
        if (!payload.user_id) {
          showToast('Vui lòng chọn người nhận', 'error');
          return;
        }
      }
      try {
        const res = await notificationAPI.createNotification(payload);
        modal.classList.remove('show');
        document.getElementById('composeForm').reset();
        showToast(res.message || `Đã gửi ${res.count || 1} thông báo`, 'success');
        currentTab = 'all';
        document.querySelector('[data-tab="all"]').classList.add('active');
        document.querySelector('[data-tab="system"]')?.classList.remove('active');
        loadNotifications();
      } catch (err) {
        showToast(err.message, 'error');
      }
    });

    loadUsersForCompose();
    loadNotifications();
  </script>
</body>
</html>
