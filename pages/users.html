<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quản lý Tài khoản - Vinhomes</title>
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body>
  <div id="navbar-placeholder"></div>
  <div class="container">
    <div class="page-header">
      <div>
        <h1 class="page-title">Quản lý Tài khoản</h1>
        <p class="page-subtitle">UC 2.7.7 — Admin quản lý người dùng hệ thống</p>
      </div>
      <button class="btn btn-primary" id="addUserBtn">+ Thêm tài khoản</button>
    </div>

    <div class="filter-bar">
      <select id="filterRole">
        <option value="">Tất cả vai trò</option>
        <option value="admin">Quản trị viên</option>
        <option value="manager">Ban quản lý</option>
        <option value="staff">Nhân viên</option>
        <option value="resident">Cư dân</option>
      </select>
      <select id="filterStatus">
        <option value="">Tất cả trạng thái</option>
        <option value="active">Hoạt động</option>
        <option value="inactive">Vô hiệu</option>
        <option value="locked">Khóa</option>
      </select>
    </div>

    <div class="section" id="usersList"><div class="loading"><div class="spinner"></div></div></div>
  </div>

  <div class="modal" id="userModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="userModalTitle">Thêm tài khoản</h2>
        <button class="close-btn" id="closeUserModal">&times;</button>
      </div>
      <form id="userForm">
        <input type="hidden" id="editUserId" />
        <div class="form-group"><label>Tên đăng nhập *</label><input type="text" id="uUsername" required /></div>
        <div class="form-group"><label>Email *</label><input type="email" id="uEmail" required /></div>
        <div class="form-group"><label>Mật khẩu <span id="pwHint">*</span></label><input type="password" id="uPassword" minlength="6" /></div>
        <div class="form-row">
          <div class="form-group">
            <label>Vai trò</label>
            <select id="uRole" required>
              <option value="resident">Cư dân</option>
              <option value="staff">Nhân viên</option>
              <option value="manager">Ban quản lý</option>
              <option value="admin">Quản trị viên</option>
            </select>
          </div>
          <div class="form-group">
            <label>Trạng thái</label>
            <select id="uStatus">
              <option value="active">Hoạt động</option>
              <option value="inactive">Vô hiệu</option>
              <option value="locked">Khóa</option>
            </select>
          </div>
        </div>
        <div class="form-buttons">
          <button type="button" class="btn-cancel" id="cancelUser">Hủy</button>
          <button type="submit" class="btn btn-primary">Lưu</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { initLayout } from '../js/modules/layout.js';
    import usersAPI from '../js/api/users.js';
    import { showToast, formatDate } from '../js/utils/helpers.js';

    await initLayout({ requiredRoles: ['admin'] });

    let users = [];
    const ROLE_LABEL = { admin: 'Quản trị viên', manager: 'Ban quản lý', staff: 'Nhân viên', resident: 'Cư dân' };
    const STATUS_BADGE = { active: 'badge-green', inactive: 'badge-gray', locked: 'badge-red' };

    async function loadUsers() {
      try {
        const params = {};
        if (document.getElementById('filterRole').value) params.role = document.getElementById('filterRole').value;
        if (document.getElementById('filterStatus').value) params.status = document.getElementById('filterStatus').value;
        const res = await usersAPI.getUsers(params);
        // Handle both array and object responses
        users = Array.isArray(res) ? res : (res.data || res.users || []);
        renderUsers(users);
      } catch (err) {
        document.getElementById('usersList').innerHTML = `<div class="alert alert-error">${err.message}</div>`;
      }
    }

    function renderUsers(list) {
      const el = document.getElementById('usersList');
      if (!list.length) {
        el.innerHTML = '<div class="empty-state"><div class="empty-state-icon">👤</div><p>Chưa có tài khoản</p></div>';
        return;
      }
      el.innerHTML = `<div class="table-responsive"><table>
        <thead><tr><th>Username</th><th>Email</th><th>Vai trò</th><th>Trạng thái</th><th>Ngày tạo</th><th>Thao tác</th></tr></thead>
        <tbody>${list.map(u => `<tr>
          <td><strong>${u.username}</strong></td>
          <td>${u.email}</td>
          <td>${ROLE_LABEL[u.role] || u.role}</td>
          <td><span class="badge ${STATUS_BADGE[u.status] || 'badge-gray'}">${u.status}</span></td>
          <td>${formatDate(u.created_at)}</td>
          <td>
            <button class="btn btn-sm btn-outline edit-user" data-id="${u.id}">Sửa</button>
            <button class="btn btn-sm btn-outline deactivate-user" data-id="${u.id}">Vô hiệu</button>
          </td>
        </tr>`).join('')}</tbody></table></div>`;

      el.querySelectorAll('.edit-user').forEach(btn => btn.addEventListener('click', () => openEdit(btn.dataset.id)));
      el.querySelectorAll('.deactivate-user').forEach(btn => btn.addEventListener('click', () => deactivate(btn.dataset.id)));
    }

    const modal = document.getElementById('userModal');
    document.getElementById('addUserBtn').addEventListener('click', () => {
      document.getElementById('userModalTitle').textContent = 'Thêm tài khoản';
      document.getElementById('editUserId').value = '';
      document.getElementById('userForm').reset();
      document.getElementById('uPassword').required = true;
      document.getElementById('pwHint').textContent = '*';
      modal.classList.add('show');
    });
    document.getElementById('closeUserModal').addEventListener('click', () => modal.classList.remove('show'));
    document.getElementById('cancelUser').addEventListener('click', () => modal.classList.remove('show'));

    function openEdit(id) {
      const u = users.find(x => x.id === id);
      if (!u) return;
      document.getElementById('userModalTitle').textContent = 'Sửa tài khoản';
      document.getElementById('editUserId').value = u.id;
      document.getElementById('uUsername').value = u.username;
      document.getElementById('uUsername').disabled = true;
      document.getElementById('uEmail').value = u.email;
      document.getElementById('uRole').value = u.role;
      document.getElementById('uStatus').value = u.status;
      document.getElementById('uPassword').value = '';
      document.getElementById('uPassword').required = false;
      document.getElementById('pwHint').textContent = '(để trống nếu không đổi)';
      modal.classList.add('show');
    }

    document.getElementById('userForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const editId = document.getElementById('editUserId').value;
      try {
        if (editId) {
          const data = {
            email: document.getElementById('uEmail').value,
            role: document.getElementById('uRole').value,
            status: document.getElementById('uStatus').value,
          };
          const pw = document.getElementById('uPassword').value;
          if (pw) data.password = pw;
          await usersAPI.updateUser(editId, data);
          showToast('Đã cập nhật tài khoản', 'success');
        } else {
          await usersAPI.createUser({
            username: document.getElementById('uUsername').value,
            email: document.getElementById('uEmail').value,
            password: document.getElementById('uPassword').value,
            role: document.getElementById('uRole').value,
          });
          showToast('Đã tạo tài khoản', 'success');
        }
        modal.classList.remove('show');
        document.getElementById('uUsername').disabled = false;
        loadUsers();
      } catch (err) { showToast(err.message, 'error'); }
    });

    async function deactivate(id) {
      if (!confirm('Vô hiệu hóa tài khoản này?')) return;
      try {
        await usersAPI.deleteUser(id);
        showToast('Đã vô hiệu hóa', 'success');
        loadUsers();
      } catch (err) { showToast(err.message, 'error'); }
    }

    document.getElementById('filterRole').addEventListener('change', loadUsers);
    document.getElementById('filterStatus').addEventListener('change', loadUsers);
    loadUsers();
  </script>
</body>
</html>
